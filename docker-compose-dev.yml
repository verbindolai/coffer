version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: coffer2-postgres
    environment:
      POSTGRES_DB: coffer2
      POSTGRES_USER: coffer2
      POSTGRES_PASSWORD: coffer2
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffer2"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
