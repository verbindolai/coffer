spring:
  application:
    name: coffer

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:coffer}
    username: ${DB_USERNAME:coffer}
    password: ${DB_PASSWORD:coffer}
    driver-class-name: org.postgresql.Driver

  liquibase:
    change-log: classpath:db/changelog/db.changelog.yaml
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true

# Application-specific configuration
coffer:
  storage:
    base-path: ${STORAGE_BASE_PATH:./data/images}
    max-file-size-bytes: 10485760  # 10MB
    allowed-content-types: image/jpeg,image/png,image/webp

# Numista API configuration
numista:
  api:
    base-url: https://api.numista.com
    key: ${NUMISTA_API_KEY}

# Swissquote API configuration
swissquote:
  api:
    base-url: https://forex-data-feed.swissquote.com