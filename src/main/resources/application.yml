spring:
  application:
    name: coffer

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:coffer2}
    username: ${DB_USERNAME:coffer2}
    password: ${DB_PASSWORD:coffer2}
    driver-class-name: org.postgresql.Driver

  liquibase:
    change-log: classpath:db/changelog/db.changelog.yaml
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true

# Application-specific configuration
coffer:
  storage:
    base-path: ${STORAGE_BASE_PATH:./data/images}
    max-file-size-bytes: 10485760  # 10MB
    allowed-content-types: image/jpeg,image/png,image/webp
  metal-quotes:
    update-interval-cron: "${METAL_QUOTES_CRON:0 */5 * * * 1-5}"
    tracked-metal-codes:
      - XAG
      - XAU
  issue-prices:
    update-interval-cron: "${ISSUE_PRICES_CRON:0 0 2 * * *}"  # Daily at 2 AM
    batch-size: 50
    rate-limit-delay-ms: 100
    max-issues-per-coin: 10
  portfolio:
    snapshot-cron: "${PORTFOLIO_SNAPSHOT_CRON:0 0 * * * *}"  # Every hour
# Numista API configuration
numista:
  api:
    base-url: https://api.numista.com
    key: ${NUMISTA_API_KEY}

# Swissquote API configuration
swissquote:
  api:
    base-url: https://forex-data-feed.swissquote.com