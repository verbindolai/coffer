databaseChangeLog:
  - changeSet:
      id: 006-drop-issues-foreign-key
      author: coffer2
      changes:
        - dropForeignKeyConstraint:
            baseTableName: issues
            constraintName: fk_issues_coin_id

  - changeSet:
      id: 006-drop-issues-coin-id-index
      author: coffer2
      changes:
        - dropIndex:
            indexName: idx_issues_coin_id
            tableName: issues

  - changeSet:
      id: 006-drop-issues-coin-id-column
      author: coffer2
      changes:
        - dropColumn:
            tableName: issues
            columnName: coin_id

  - changeSet:
      id: 006-add-unique-constraint-numista-id
      author: coffer2
      changes:
        - addUniqueConstraint:
            tableName: issues
            columnNames: numista_id
            constraintName: uk_issues_numista_id

  - changeSet:
      id: 006-create-coin-issues-table
      author: coffer2
      changes:
        - createTable:
            tableName: coin_issues
            columns:
              - column:
                  name: coin_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: issue_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
                  defaultValueComputed: CURRENT_TIMESTAMP

  - changeSet:
      id: 006-add-coin-issues-primary-key
      author: coffer2
      changes:
        - addPrimaryKey:
            tableName: coin_issues
            columnNames: coin_id, issue_id
            constraintName: pk_coin_issues

  - changeSet:
      id: 006-add-coin-issues-foreign-keys
      author: coffer2
      changes:
        - addForeignKeyConstraint:
            baseTableName: coin_issues
            baseColumnNames: coin_id
            constraintName: fk_coin_issues_coin_id
            referencedTableName: coins
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: coin_issues
            baseColumnNames: issue_id
            constraintName: fk_coin_issues_issue_id
            referencedTableName: issues
            referencedColumnNames: id
            onDelete: CASCADE

  - changeSet:
      id: 006-create-coin-issues-indexes
      author: coffer2
      changes:
        - createIndex:
            indexName: idx_coin_issues_coin_id
            tableName: coin_issues
            columns:
              - column:
                  name: coin_id
        - createIndex:
            indexName: idx_coin_issues_issue_id
            tableName: coin_issues
            columns:
              - column:
                  name: issue_id
